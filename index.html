<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOS Faune Toulouse — Redirection</title>
    <!-- Délai de 1 seconde pour une transition plus fluide et lisible -->
    <meta http-equiv="refresh" content="1; URL='https://www.sosfaunetoulouse.fr/'">
    <style>
      :root {
        --bg: #f8faf7;
        --card-bg: #ffffff;
        --text-main: #1f2937;
        --text-muted: #4b5563;
        --accent: #2e6040;
        --accent-light: #e8efe9;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text-main);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1rem;
      }

      .card {
        background: var(--card-bg);
        padding: 2.25rem 2rem;
        border-radius: 14px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        max-width: 440px;
        width: 100%;
        text-align: center;
        border: 1px solid #e5e7eb;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        background: var(--accent-light);
        color: var(--accent);
        font-size: 0.85rem;
        font-weight: 600;
        padding: 0.35rem 0.8rem;
        border-radius: 9999px;
        margin-bottom: 1.25rem;
      }

      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: var(--accent);
      }

      p {
        font-size: 0.95rem;
        color: var(--text-muted);
        line-height: 1.5;
        margin-bottom: 1.5rem;
      }

      .btn {
        display: inline-block;
        background-color: var(--accent);
        color: #ffffff;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        padding: 0.65rem 1.25rem;
        border-radius: 8px;
        transition: background-color 0.2s ease;
      }

      .btn:hover {
        background-color: #224730;
      }

      /* Discrète animation de chargement */
      .loader {
        width: 32px;
        height: 32px;
        border: 3px solid var(--accent-light);
        border-top-color: var(--accent);
        border-radius: 50%;
        margin: 0 auto 1.25rem auto;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="loader" aria-hidden="true"></div>
      <div class="badge">🌿 Faune Sauvage</div>
      <h1>SOS Faune Toulouse</h1>
      <p>Nous vous redirigeons vers le site officiel de l'association…</p>
      <a class="btn" href="https://www.sosfaunetoulouse.fr/">Accéder au site sans attendre</a>
    </main>
  </body>
</html>
